# =====================================================================
# Configuração do Alembic — Núcleo de Atendimento & Capacitação
# =====================================================================
[alembic]

# Local do diretório de migrações (relativo à raiz do projeto)
script_location = migrations

# Garante que a raiz do projeto esteja no sys.path (permite `from app...` no env.py)
prepend_sys_path = .

# Fuso para os timestamps de versão nos nomes de arquivo
timezone = UTC

# PADRÃO de nome dos arquivos de migração: legível e ordenável
# Gera ex.: migrations/versions/2026_09_11_1430-a1b2c3d4_cria_schema_inicial.py
file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d%%(minute)02d-%%(rev)s_%%(slug)s

# Separador/versão para branch labels (deixe o padrão)
version_path_separator = os

# A URL do banco NÃO fica aqui — é lida do ambiente em migrations/env.py:
#   config.set_main_option("sqlalchemy.url", DATABASE_URL)
# Isso permite trocar SQLite ↔ PostgreSQL sem tocar neste arquivo e evita
# o trabalho de escapar caracteres especiais (ex.: %) em senhas no ini.
# Valor placeholder apenas para o Alembic não reclamar se env.py falhar:
sqlalchemy.url = driver://user:pass@localhost/dbname

# =====================================================================
# Opções de postwrite (não usadas por padrão — mantidas como referência)
# =====================================================================
# template args to use when rendering 'revision' scripts
# file_template = ...

[post_write_hooks]

# Formata as migrações geradas com black (opcional, recomendado)
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = --line-length 100 REVISION_SCRIPT_FILENAME

# Lint opcional
# lint.type = console_scripts
# lint.entrypoint = flake8
# lint.options = --max-line-length 100 REVISION_SCRIPT_FILENAME

# =====================================================================
# Logging
# =====================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# Mude para INFO durante o desenvolvimento para ver o SQL executado
# pelas migrações — ótimo para auditar o que o autogenerate vai aplicar:
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S